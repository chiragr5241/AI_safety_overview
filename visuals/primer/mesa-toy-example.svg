<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300" width="400" height="300">
  <!-- Simplified from Hubinger et al. (2019), Risks from Learned Optimization, Figure 3:
       five episodes reduced to one training grid and one deployment grid. -->
  <defs>
    <marker id="toA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1D6B67"/></marker>
    <marker id="toB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B8374A"/></marker>
    <g id="grid">
      <rect x="0" y="0" width="58" height="44" fill="#D5E7E4"/>
      <rect x="116" y="0" width="58" height="44" fill="#F5D9DD"/>
      <path d="M58 0V132M116 0V132M0 44H174M0 88H174" stroke="#CFD6D0" stroke-width="1.5" fill="none"/>
      <rect x="0" y="0" width="174" height="132" fill="none" stroke="#16202A" stroke-width="2"/>
      <text x="29" y="30" font-size="22" font-weight="700" text-anchor="middle" fill="#14514E">A</text>
      <text x="145" y="30" font-size="22" font-weight="700" text-anchor="middle" fill="#9C2A3D">B</text>
      <g transform="translate(29 113)">
        <line x1="0" y1="-10" x2="0" y2="-15" stroke="#16202A" stroke-width="2"/>
        <circle cx="0" cy="-16" r="2.4" fill="#16202A"/>
        <rect x="-13" y="-10" width="26" height="21" rx="5" fill="#16202A"/>
        <circle cx="-5" cy="0" r="2.8" fill="#FFFFFF"/>
        <circle cx="5" cy="0" r="2.8" fill="#FFFFFF"/>
      </g>
    </g>
  </defs>
  <g font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" fill="#16202A" text-anchor="middle">
    <line x1="200" y1="22" x2="200" y2="276" stroke="#CFD6D0" stroke-width="1.5" stroke-dasharray="4 5"/>

    <text x="103" y="40" font-size="21" font-weight="700">Training</text>
    <text x="103" y="63" font-size="15.5" fill="#56626C">weights can change</text>
    <use xlink:href="#grid" href="#grid" x="16" y="78"/>
    <path d="M45 170V128" stroke="#1D6B67" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#toA)"/>
    <text x="103" y="241" font-size="19" font-weight="700" fill="#14514E">Goes to A</text>
    <text x="103" y="263" font-size="15.5" fill="#56626C">so it is not retrained</text>

    <text x="297" y="40" font-size="21" font-weight="700">Deployment</text>
    <text x="297" y="63" font-size="15.5" fill="#56626C">weights are fixed</text>
    <use xlink:href="#grid" href="#grid" x="210" y="78"/>
    <path d="M258 191H345Q355 191 355 181V128" stroke="#B8374A" stroke-width="3.5" fill="none" stroke-linecap="round" marker-end="url(#toB)"/>
    <text x="297" y="241" font-size="19" font-weight="700" fill="#9C2A3D">Goes to B</text>
    <text x="297" y="263" font-size="15.5" fill="#56626C">its own goal</text>
  </g>
</svg>
